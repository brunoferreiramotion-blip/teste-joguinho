<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DF4E10">
<title>Pit Stop Gatorade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #DF4E10;
    --white: #FFFFFF;
    --black: #000000;
    --lit: #F1F2F6;
    --miss: #FFD23F;
    /* 1 pixel da arte original (1080 x 1920) */
    --px: calc(min(100vw, 56.25dvh) / 1080);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--orange); overflow: hidden; }
  body {
    color: var(--white);
    font-family: "Roboto Slab", Georgia, serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .screen {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding-top: env(safe-area-inset-top);
  }
  .grow { flex: 1 1 0; min-height: 0; }
  .grow-2 { flex: 2 1 0; min-height: 0; }
  .header { width: calc(780 * var(--px)); display: block; }
  .footer { width: calc(740 * var(--px)); display: block; }

  .status {
    height: calc(130 * var(--px));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; text-transform: uppercase; text-align: center;
    font-size: calc(46 * var(--px)); letter-spacing: .02em; line-height: 1.1;
  }
  .status.big { font-size: calc(110 * var(--px)); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, calc(236 * var(--px)));
    grid-auto-rows: calc(184 * var(--px));
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer;
    touch-action: manipulation;
  }
  .dot {
    width: calc(106 * var(--px)); height: calc(106 * var(--px));
    border-radius: 50%;
    background: var(--black);
    border: calc(4 * var(--px)) solid var(--white);
    transition: transform .08s ease-out;
  }
  .cell.on .dot {
    background: var(--lit);
    box-shadow: inset 0 0 0 calc(12 * var(--px)) var(--black);
  }
  .cell.hit .dot { transform: scale(.88); }
  .cell.miss .dot { border-color: var(--miss); }

  .actions {
    height: calc(200 * var(--px));
    display: flex; align-items: center; justify-content: center;
  }
  .btn {
    font-family: inherit; font-weight: 900; text-transform: uppercase;
    font-size: calc(46 * var(--px)); letter-spacing: .03em;
    color: var(--orange); background: var(--white);
    border: 0; border-radius: 999px;
    padding: calc(30 * var(--px)) calc(80 * var(--px));
    cursor: pointer;
    box-shadow: 0 calc(8 * var(--px)) 0 rgba(0,0,0,.25);
  }
  .btn:active { transform: translateY(calc(4 * var(--px))); box-shadow: 0 calc(4 * var(--px)) 0 rgba(0,0,0,.25); }
  .hidden { visibility: hidden; }

  .stripes {
    width: 100%; height: calc(90 * var(--px)); flex: none; overflow: hidden;
    margin-top: calc(70 * var(--px));
    padding-bottom: env(safe-area-inset-bottom);
  }
  .stripes::before {
    content: ""; display: block; height: 100%;
    margin-left: calc(-60 * var(--px)); width: calc(100% + 120 * var(--px));
    background: repeating-linear-gradient(90deg,
      var(--white) 0 calc(62 * var(--px)),
      transparent calc(62 * var(--px)) calc(112 * var(--px)));
    transform: skewX(20deg);
  }

  /* Resultado */
  .result {
    position: fixed; inset: 0;
    background: var(--orange);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 calc(90 * var(--px));
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .result.show { opacity: 1; pointer-events: auto; }
  .result .kicker { font-weight: 700; font-size: calc(46 * var(--px)); text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .result .time { font-weight: 900; font-size: calc(280 * var(--px)); line-height: 1; margin: calc(10 * var(--px)) 0 calc(20 * var(--px)); }
  .result .time small { font-size: .3em; margin-left: .1em; }
  .result h1 { font-weight: 900; text-transform: uppercase; font-size: calc(110 * var(--px)); line-height: 1.02; margin-top: calc(40 * var(--px)); }
  .result p.msg { font-weight: 700; font-size: calc(56 * var(--px)); line-height: 1.25; margin-top: calc(28 * var(--px)); }
  .result .stats {
    display: flex; gap: calc(90 * var(--px)); justify-content: center;
    margin-top: calc(60 * var(--px)); font-weight: 700; font-size: calc(38 * var(--px)); text-transform: uppercase;
  }
  .result .stats b { display: block; font-size: calc(70 * var(--px)); font-weight: 900; }
  .result .btn { margin-top: calc(80 * var(--px)); }
  .result .logo { width: calc(560 * var(--px)); margin-top: calc(90 * var(--px)); opacity: .95; }
</style>
</head>

    b.setAttribute("aria-label", "Luz " + (i + 1));
    b.innerHTML = '<span class="dot"></span>';
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); onTap(i); });
    grid.appendChild(b);
    cells.push(b);
  }

  let state = "idle";   // idle | countdown | wait | lit | done
  let litIndex = -1, litAt = 0, times = [], errors = 0, timer = null;

  function setStatus(text, big) {
    statusEl.textContent = text;
    statusEl.classList.toggle("big", !!big);
  }

  function clearAll() { cells.forEach(c => c.classList.remove("on", "hit", "miss")); }

  function start() {
    clearTimeout(timer);
    result.classList.remove("show");
    startBtn.classList.add("hidden");
    clearAll();
    times = []; errors = 0; litIndex = -1;
    state = "countdown";
    let n = 3;
    setStatus(n, true);
    const tick = () => {
      n--;
      if (n > 0) { setStatus(n, true); timer = setTimeout(tick, 700); }
      else { setStatus("Vai!", true); timer = setTimeout(next, 450); }
    };
    timer = setTimeout(tick, 700);
  }

  function next() {
    if (times.length >= ROUNDS) return finish();
    state = "wait";
    setStatus(times.length + " / " + ROUNDS);
    const gap = times.length === 0 ? 0 : GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
    timer = setTimeout(() => {
      let i;
      do { i = Math.floor(Math.random() * 16); } while (i === litIndex);
      litIndex = i;
      cells[i].classList.add("on");
      litAt = performance.now();
      state = "lit";
    }, gap);
  }

  function onTap(i) {
    if (state !== "lit" && state !== "wait") return;
    const c = cells[i];
    if (state === "lit" && i === litIndex) {
      const t = performance.now() - litAt;
      times.push(t);
      c.classList.remove("on");
      c.classList.add("hit");
      setTimeout(() => c.classList.remove("hit"), 120);
      if (navigator.vibrate) navigator.vibrate(12);
      setStatus(times.length + " / " + ROUNDS + "  ·  " + Math.round(t) + " ms");
      state = "wait";
      timer = setTimeout(next, 0);
    } else {
      errors++;
      c.classList.add("miss");
      setTimeout(() => c.classList.remove("miss"), 200);
    }
  }

  function finish() {
    state = "done";
    clearAll();
    const avgRaw = times.reduce((a, b) => a + b, 0) / times.length;
    const avg = Math.round(avgRaw + (errors * MISS_PENALTY_MS) / times.length);
    const best = Math.round(Math.min(...times));
    const r = avg <= FAST_MS ? RESULTS.fast : avg <= MEDIUM_MS ? RESULTS.medium : RESULTS.slow;
    document.getElementById("avg").textContent = avg;
    document.getElementById("best").textContent = best;
    document.getElementById("errors").textContent = errors;
    document.getElementById("title").textContent = r.title;
    document.getElementById("msg").textContent = r.msg;
    setStatus("Toque nas luzes que acenderem");
    startBtn.classList.remove("hidden");
    setTimeout(() => result.classList.add("show"), 250);
  }

  startBtn.addEventListener("click", start);
  document.getElementById("again").addEventListener("click", start);
</script>
</body>
</html>
